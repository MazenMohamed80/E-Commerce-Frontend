@if (myProduct) {
  <div class="card h-100 shadow-sm">
    <img
      class="card-img-top product-image"
      [src]="staticURL + myProduct.imgURL"
      [alt]="myProduct.name"
    />
    <div class="card-body d-flex flex-column">
      <h4 class="card-title">{{ myProduct.name }}</h4>
      <p class="text-muted small">
        {{ myProduct.category }} · {{ myProduct.subCategory }} · {{ myProduct.season }}
      </p>
      <p class="card-text flex-grow-1">{{ myProduct.desc }}</p>
      <p class="fw-bold mb-2">{{ myProduct.price }} EGP</p>
      <p class="small">Stock: {{ myProduct.stock }}</p>
      @if (message) {
        <div class="small text-success mb-2">{{ message }}</div>
      }
      <div class="d-flex gap-2">
        <a
          class="btn btn-outline-primary flex-fill"
          [routerLink]="['/products-list', myProduct.slug]"
          >More details</a
        ><button class="btn btn-primary" (click)="addToCart()" [disabled]="myProduct.stock < 1">
          Add
        </button>
      </div>
    </div>
  </div>
}
